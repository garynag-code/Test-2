# Cloudflare Worker configuration for the Worship Team Roster API.
#
# Setup (see server/README.md for the full walkthrough):
#   1. npm i -g wrangler && wrangler login
#   2. wrangler d1 create worship-roster        # paste the database_id below
#   3. wrangler d1 execute worship-roster --remote --file=./schema.sql
#   4. Generate VAPID keys, then store the private one as a secret:
#        wrangler secret put VAPID_PRIVATE_KEY
#   5. wrangler deploy

name = "worship-roster-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The exact origin(s) allowed to call the API (CORS). Set this to where the
# front-end is hosted — e.g. your GitHub Pages / Cloudflare Pages URL. Comma
# separate multiple origins. Never use "*": that would let any site call the API.
[vars]
ALLOWED_ORIGINS = "https://garynag-code.github.io"
VAPID_PUBLIC_KEY = "REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY"
VAPID_SUBJECT = "mailto:leader@example.com"

# Managed SQLite database.
[[d1_databases]]
binding = "DB"
database_name = "worship-roster"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Daily cron: compute due reminders and send push notifications (07:00 UTC).
[triggers]
crons = ["0 7 * * *"]

# VAPID_PRIVATE_KEY is a SECRET — never put it here or in [vars].
# Set it with:  wrangler secret put VAPID_PRIVATE_KEY
