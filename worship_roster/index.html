<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Mobile-friendly worship team roster, practice scheduling by majority vote, song lists, chords and reminders." />
  <title>Worship Team Roster</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-header__title">🎵 Worship Team Roster</h1>
      <div class="app-header__user">
        <label for="current-user" class="visually-hidden">You are</label>
        <select id="current-user" class="user-select" aria-label="Sign in as team member"></select>
      </div>
    </div>
    <p class="app-header__season" id="season-label"></p>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Primary">
    <button class="tabbar__btn" data-tab="roster" aria-current="true">
      <span class="tabbar__icon">📅</span><span class="tabbar__label">Roster</span>
    </button>
    <button class="tabbar__btn" data-tab="voting">
      <span class="tabbar__icon">🗳️</span><span class="tabbar__label">Practices</span>
    </button>
    <button class="tabbar__btn" data-tab="songs">
      <span class="tabbar__icon">🎸</span><span class="tabbar__label">Songs</span>
    </button>
    <button class="tabbar__btn" data-tab="reminders">
      <span class="tabbar__icon">🔔</span><span class="tabbar__label">Reminders</span>
    </button>
    <button class="tabbar__btn" data-tab="team">
      <span class="tabbar__icon">👥</span><span class="tabbar__label">Team</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
