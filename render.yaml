# One-click deployment, for testing Mission Hero from a phone with no computer
# in the picture. Render reads this file, creates the database and the web
# service, and gives the service an https:// address — which the session
# cookies require, since they are marked Secure in production.
#
# This file has to live at the repository root: Render only looks for it here,
# not inside a subdirectory. The app itself is in mission-hero/, which is what
# `rootDir` below points at.
#
# Deploy: render.com → Blueprints → New Blueprint Instance → pick this
# repository. It will ask for SEED_PARENT_PASSWORD; everything else is
# derived. TESTING.md has the same steps written out for a phone.
#
# Free tiers being what they are: the web service sleeps after 15 minutes of
# inactivity and takes about a minute to wake, and the free database expires
# after 30 days.

services:
  - type: web
    name: mission-hero
    runtime: node
    plan: free
    # The repository holds more than this app; everything below runs in here.
    rootDir: mission-hero
    # Closest Render region to southern Africa. Oregon, Ohio, Virginia and
    # Singapore are the alternatives — the database below must match.
    region: frankfurt
    # `--include=dev` is not optional: Render sets NODE_ENV=production, which
    # makes npm skip devDependencies, and the build needs TypeScript and
    # Tailwind while the start command needs the Prisma CLI and tsx.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run at start because the database only exists at runtime.
    # `--if-empty` leaves an existing family alone: a free instance restarts
    # whenever it wakes, and a plain seed would wipe everything each time.
    startCommand: >-
      export APP_URL="${RENDER_EXTERNAL_URL:-$APP_URL}" &&
      npx prisma migrate deploy &&
      npx tsx prisma/seed.ts --if-empty &&
      npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Signs the session cookies. Render generates it once and keeps it.
      - key: AUTH_SECRET
        generateValue: true
      # Asked for at deploy time. The demo password is published in this
      # repository and there is no change-password screen yet, so anything
      # reachable from the internet needs its own.
      - key: SEED_PARENT_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mission-hero-db
          property: connectionString
      - key: MEDIA_UPLOADS_ENABLED
        value: 'false'

databases:
  - name: mission-hero-db
    plan: free
    region: frankfurt
    databaseName: mission_hero
    user: mission_hero
