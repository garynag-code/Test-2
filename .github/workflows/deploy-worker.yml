name: Deploy Worship Roster API (Cloudflare)

# Manual, button-triggered deploy of the shared backend to Cloudflare.
# Run it from the repo's Actions tab -> "Deploy Worship Roster API" -> Run workflow.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - a Cloudflare API token with Workers + D1 edit rights
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#   VAPID_PRIVATE_KEY      - the Web Push private key (kept out of the repo)
#
# This job creates the D1 database if needed, applies the schema, stores the
# VAPID private key as a Worker secret, and deploys the Worker. It then prints
# the Worker URL in the run summary — paste that into worship_roster/js/config.js
# (apiBase) to switch the app into shared mode.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worship_roster/server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required secrets are set
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing"; missing=1; }
          [ -n "${{ secrets.VAPID_PRIVATE_KEY }}" ] || { echo "::error::VAPID_PRIVATE_KEY secret is missing"; missing=1; }
          exit $missing

      - name: Ensure D1 database exists and capture its id
        run: |
          set -e
          # Create the database (ignore the error if it already exists).
          $WRANGLER d1 create worship-roster || true
          # Read its id back from the account's D1 list.
          DB_ID=$($WRANGLER d1 list --json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const list=JSON.parse(s);
              const db=list.find(x=>x.name==='worship-roster');
              if(!db){console.error('worship-roster database not found');process.exit(1);}
              process.stdout.write(db.uuid||db.database_id||db.id);
            });")
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "Using D1 database id: $DB_ID"

      - name: Inject the D1 id into wrangler.toml
        run: sed -i "s|REPLACE_WITH_YOUR_D1_DATABASE_ID|${DB_ID}|" wrangler.toml

      - name: Apply the database schema (idempotent)
        run: $WRANGLER d1 execute worship-roster --remote --file=./schema.sql

      - name: Store the VAPID private key as a Worker secret
        run: printf '%s' "${{ secrets.VAPID_PRIVATE_KEY }}" | $WRANGLER secret put VAPID_PRIVATE_KEY

      - name: Deploy the Worker
        run: $WRANGLER deploy | tee deploy.log

      - name: Show the Worker URL
        run: |
          echo "### ✅ Worker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Copy this URL into \`worship_roster/js/config.js\` as \`apiBase\`:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          URL=$(grep -oE "https://[a-zA-Z0-9._-]*workers\.dev" deploy.log | head -1)
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${URL:-<see deploy log above for the URL>}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Worker URL::${URL:-see deploy log}"
